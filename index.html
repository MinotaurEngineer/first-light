<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<title>First Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: spec-sheet system. White page, full-bleed black bands, bone spec panels, hairline rules, square corners.
   Training stages are always black, full-bleed. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #EEECE5;   /* bone: spec panels */
  --ink: #000000;
  --muted: #6E6E6B;
  --line: #D8D7D2;
  --accent: #000000;      /* primary action = ink */
  --accent-ink: #FFFFFF;
  --signal: #B8862B;
  --good: #2E8A57;
  --warn: #C7951B;
  --bad: #C5402E;
  --band-bg: #000000;
  --band-ink: #FFFFFF;
  --band-muted: #8A8A86;
  --band-line: #2A2A2A;
  --stage-bg: #000000;
  --stage-ink: #FFFFFF;
  --font-display: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 0px;
  --tap: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #000000; --surface-2: #171715; --ink: #FFFFFF; --muted: #8C8C88;
    --line: #2B2B29; --accent: #FFFFFF; --accent-ink: #000000; --signal: #D9A54A;
    --good: #4CAE76; --warn: #DDB04A; --bad: #E0614D;
    --band-bg: #EEECE5; --band-ink: #000000; --band-muted: #6E6E6B; --band-line: #D2D0C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #000000; --surface-2: #171715; --ink: #FFFFFF; --muted: #8C8C88;
  --line: #2B2B29; --accent: #FFFFFF; --accent-ink: #000000; --signal: #D9A54A;
  --good: #4CAE76; --warn: #DDB04A; --bad: #E0614D;
  --band-bg: #EEECE5; --band-ink: #000000; --band-muted: #6E6E6B; --band-line: #D2D0C8;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45; letter-spacing: -0.005em;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
#app { min-height: 100%; position: relative; overflow-x: clip; }

/* ---- screens ---- */
.screen {
  min-height: 100%; box-sizing: border-box;
  padding-block: 24px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  max-width: 1200px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 28px;
}
/* Training stage: always black, whichever theme the page is in. */
.stage {
  position: fixed; inset: 0; background: var(--stage-bg); color: var(--stage-ink);
  touch-action: none; user-select: none; -webkit-user-select: none; z-index: 20;
  --bg: #000000; --surface: #0E0E0E; --surface-2: #1A1A19; --ink: #FFFFFF; --muted: #7C7C78; --line: #2A2A28;
  --accent: #FFFFFF; --accent-ink: #000000; --signal: #E3B25A; --good: #4CAE76; --warn: #DDB04A; --bad: #E0614D;
  color-scheme: dark;
}
.stage canvas { display: block; width: 100%; height: 100%; }

/* ---- type ---- */
.h-display {
  font-family: var(--font-display); font-weight: 500; text-transform: uppercase;
  font-size: clamp(2.6rem, 6.4vw, 5.6rem); line-height: 0.9; letter-spacing: -0.04em; margin: 0; text-wrap: balance;
}
.h-2 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; line-height: 1.15; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.label { font-family: var(--font-mono); font-weight: 400; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--muted); }
.prose { max-width: 60ch; }

/* ---- controls: thin rectangles, small sentence-case text ---- */
.btn {
  appearance: none; border: 1px solid var(--ink); background: transparent; color: var(--ink);
  font: 500 0.95rem/1 var(--font-body); letter-spacing: -0.005em;
  min-height: var(--tap); padding: 0 20px; border-radius: 0;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active { background: var(--surface-2); }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:active { opacity: 0.85; background: var(--accent); }
.btn-big { min-height: 64px; font-size: 1.05rem; padding: 0 32px; }
.btn-quiet { border-color: transparent; color: var(--muted); padding: 0 8px; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #FFFFFF; }
.btn[disabled] { opacity: 0.35; cursor: default; }

.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button {
  appearance: none; min-height: 50px; min-width: 76px; padding: 0 18px; border-radius: 0;
  border: 1px solid var(--line); margin-left: -1px; background: transparent; color: var(--ink);
  font: 500 0.95rem/1 var(--font-body); cursor: pointer;
}
.seg button:first-child { margin-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); position: relative; z-index: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 20px 22px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }

/* Status markers are small squares. */
.dot { width: 12px; height: 12px; border-radius: 0; display: inline-block; background: var(--line); }
.dot.green { background: var(--good); } .dot.amber { background: var(--warn); } .dot.red { background: var(--bad); }
.dot.calibrating { background: transparent; border: 1px solid var(--muted); box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 600px) { .screen { gap: 20px; } }

/* PVT — calm, nearly empty stage. */
.pvt-root { position: absolute; inset: 0; color: var(--stage-ink); font-family: var(--font-body); }
.pvt-running { cursor: pointer; }

.pvt-intro {
  position: absolute; inset: 0; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 18px;
  padding: 32px max(32px, env(safe-area-inset-right, 0px)) 32px max(32px, env(safe-area-inset-left, 0px));
  max-width: 720px; margin: 0 auto;
}
.pvt-copy { margin: 0 0 12px; font-size: 1.15rem; color: var(--stage-ink); }
.pvt-start { min-width: 220px; }

.pvt-counter {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: clamp(4.5rem, 14vmin, 9rem); font-weight: 600; line-height: 1; letter-spacing: -0.02em;
  color: var(--signal); visibility: hidden; pointer-events: none;
}
.pvt-counter.pvt-on { visibility: visible; }
.pvt-counter.pvt-frozen { color: var(--stage-ink); }

.pvt-flash {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-weight: 600; font-size: 2rem; letter-spacing: 0.04em;
  color: var(--bad); opacity: 0; pointer-events: none; transition: opacity 120ms ease-out;
}
.pvt-flash.pvt-show { opacity: 1; }

.pvt-clock {
  position: absolute;
  top: max(18px, env(safe-area-inset-top, 0px));
  right: max(24px, env(safe-area-inset-right, 0px));
  font-size: 1rem; color: var(--muted); visibility: hidden; pointer-events: none;
}
.pvt-running .pvt-clock { visibility: visible; }

.pvt-end {
  position: absolute; min-width: var(--tap);
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: max(12px, env(safe-area-inset-bottom, 0px));
}

/* Wide Field module */
.wf-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wf-layer { position: absolute; inset: 0; z-index: 2; }
.wf-layer:empty { pointer-events: none; }

.wf-hud {
  position: absolute; z-index: 3; pointer-events: none;
  top: max(14px, env(safe-area-inset-top, 0px));
  left: max(18px, env(safe-area-inset-left, 0px));
}
.wf-rep { font-variant-numeric: tabular-nums; }
.wf-bar {
  position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 3px;
  background: var(--line); pointer-events: none;
}
.wf-bar-fill { height: 100%; background: var(--accent); transform-origin: left center; transition: transform 0.5s linear; }
.wf-end {
  position: absolute; z-index: 4; min-width: var(--tap);
  top: max(8px, env(safe-area-inset-top, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
}

/* instruction */
.wf-intro {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: var(--stage-bg); overflow-y: auto;
}
.wf-card { max-width: 620px; width: 100%; display: flex; flex-direction: column; gap: 18px; padding: 28px 30px; }
.wf-prose p { margin: 0 0 10px; }
.wf-card .btn-big { align-self: flex-start; min-width: 200px; }

/* answer: centre symbol */
.wf-ask {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 28px; padding: 16px;
}
.wf-q { margin: 0; color: var(--stage-ink); font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; text-align: center; }
.wf-syms { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
.wf-sym {
  width: min(28vmin, 180px); height: min(28vmin, 180px); min-width: 112px; min-height: 112px;
  padding: 0; color: var(--stage-ink); touch-action: manipulation;
}
.wf-sym svg { width: 52%; height: 52%; }

/* answer: spoke ring (whole layer is the wedge hit-area) */
.wf-ring { position: absolute; inset: 0; cursor: pointer; touch-action: manipulation; }
.wf-spoke {
  position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--signal);
  pointer-events: none;
}
.wf-spoke svg { width: 46%; height: 46%; }
.wf-spoke-hit { background: var(--signal); border-color: var(--signal); color: var(--surface); }
.wf-q-ring {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  max-width: 34vmin; font-size: 1.25rem; line-height: 1.15; pointer-events: none;
}

/* feedback */
.wf-fb {
  position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 2px solid currentColor; pointer-events: none;
}
.wf-fb svg { width: 60%; height: 60%; }
.wf-fb-ok { color: var(--good); }
.wf-fb-no { color: var(--bad); }

/* Dead Reckoning module */
.dr-root { position: absolute; inset: 0; overflow: hidden; }
.dr-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.dr-timebar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line); }
.dr-timefill { height: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(1); }

.dr-hud {
  position: absolute; top: 10px;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none;
}
.dr-hud-left { display: flex; align-items: center; gap: 12px; }
.dr-hud .dr-end { pointer-events: auto; min-width: var(--tap); }
.dr-badge {
  font-size: 0.95rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}

.dr-hint {
  position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-body); color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; pointer-events: none; white-space: nowrap;
}
.dr-lock {
  position: absolute; bottom: max(20px, env(safe-area-inset-bottom, 0px));
  right: max(20px, env(safe-area-inset-right, 0px));
}

.dr-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 72px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
  box-sizing: border-box; background: color-mix(in srgb, var(--stage-bg) 72%, transparent);
}
.dr-overlay[hidden], .dr-hint[hidden], .dr-lock[hidden], .dr-toast[hidden] { display: none; }
.dr-overlay.dr-overlay-side { background: transparent; justify-content: flex-end; align-items: center; pointer-events: none; }
.dr-overlay-side .dr-panel { pointer-events: auto; }
.dr-panel { max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
.dr-panel p { margin: 0; }
.dr-panel .btn-big { align-self: flex-start; margin-top: 8px; }

.dr-feedback { max-width: 360px; }
.dr-scores { display: flex; gap: 28px; }
.dr-big { font-size: 2.8rem; line-height: 1; font-weight: 600; color: var(--ink); }
.dr-coach { font-size: 1.05rem; }
.dr-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); }
.dr-legend span { display: inline-flex; align-items: center; gap: 8px; }
.dr-sw { display: inline-block; width: 22px; height: 4px; border-radius: 2px; }
.dr-sw-good { background: var(--good); }
.dr-sw-signal { background: var(--signal); }

.dr-toast {
  position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display);
  font-weight: 600; font-size: 1.3rem; letter-spacing: 0.04em; padding: 10px 22px; border-radius: 999px;
  pointer-events: none; z-index: 2;
}

@media (orientation: portrait) {
  .dr-overlay.dr-overlay-side { align-items: flex-end; justify-content: center; }
  .dr-feedback { max-width: 100%; }
}

/* history module */
.hs-root { display: flex; flex-direction: column; gap: 20px; }
.hs-body { display: flex; flex-direction: column; gap: 16px; }
.hs-card { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; }
.hs-chart-head { gap: 4px 16px; }
.hs-caption { font-size: 0.85rem; }
.hs-chart { width: 100%; position: relative; overflow: hidden; }
.hs-svg { display: block; overflow: visible; }

.hs-grid { stroke: var(--line); stroke-width: 1; }
.hs-axis { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.hs-marker { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.hs-marker-label { fill: var(--ink); }
.hs-band { fill: var(--accent); fill-opacity: 0.12; stroke: none; }
.hs-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.hs-bar { fill: var(--accent); fill-opacity: 0.55; }
.hs-bar.hs-last { fill-opacity: 1; }
.hs-pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.hs-pt-green { fill: var(--good); }
.hs-pt-amber { fill: var(--warn); }
.hs-pt-red { fill: var(--bad); }
.hs-pt-calibrating { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
.hs-pt.hs-last { stroke-width: 2.5; }
.hs-pt-calibrating.hs-last { stroke-width: 2; }

.hs-summary { display: flex; flex-wrap: wrap; gap: 12px 36px; padding: 2px 4px; }
.hs-stat { display: flex; flex-direction: column; gap: 2px; }
.hs-stat-val { font-size: 1.6rem; line-height: 1.1; display: flex; align-items: baseline; gap: 6px; }
.hs-unit { font-size: 0.9rem; }
.hs-empty { text-align: center; padding: 36px 22px; }

.hs-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.hs-cal-head { text-align: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.hs-cal-cell { height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 2px solid transparent; }
.hs-cal-today { border-color: var(--ink); }
.hs-cal-future .hs-cal-dot { opacity: 0.35; }
.hs-cal-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); box-sizing: border-box; }
.hs-cal-green { background: var(--good); }
.hs-cal-amber { background: var(--warn); }
.hs-cal-red { background: var(--bad); }
.hs-cal-logged { background: transparent; border: 1px dashed var(--muted); }
.hs-cal-calibrating { background: transparent; border: 2px solid var(--muted); }

.hs-clear { display: flex; justify-content: flex-end; }
.hs-confirm { display: flex; flex-direction: column; gap: 14px; border-color: var(--bad); }
.hs-confirm-text { margin: 0; }

@media (max-width: 600px) {
  .hs-summary { gap: 10px 24px; }
  .hs-stat-val { font-size: 1.3rem; }
  .hs-clear { justify-content: stretch; }
}

/* Visual-language overrides for module pieces: square corners, hairlines, mono labels. */
.wf-root *, .dr-root *, .pvt-root *, .hs-root * { border-radius: 0 !important; }
.hs-cal-dot { border-radius: 0 !important; }
.hs-cal-cell { border-radius: 0 !important; }
[class^="dr-"], [class*=" dr-"], [class^="wf-"], [class*=" wf-"], [class^="hs-"], [class*=" hs-"], [class^="pvt-"], [class*=" pvt-"] { border-radius: 0 !important; box-shadow: none !important; }
.stage .h-2, .stage .h-display { color: var(--stage-ink); }
/* Panels fade in at 250 ms. Stimuli (PVT counter, Wide Field flash/mask, walker) are never animated. */
@keyframes ms-fade-panel { from { opacity: 0; } to { opacity: 1; } }
.pvt-intro, .wf-intro, .wf-card, .dr-panel, .dr-feedback, .dr-overlay { animation: ms-fade-panel 250ms ease-out both; }
@media (prefers-reduced-motion: reduce) { .pvt-intro, .wf-intro, .wf-card, .dr-panel, .dr-feedback, .dr-overlay { animation: none; } }

/* App shell screens (prefix ms-) */
.ms-small { font-size: 0.85rem; }
.ms-unit { font-size: 0.5em; color: var(--muted); margin-left: 6px; letter-spacing: 0.02em; }

/* masthead */
.ms-mast { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.ms-wordmark {
  margin: 0; font-family: var(--font-display); font-weight: 600;
  font-size: clamp(3rem, 8.5vw, 7rem); line-height: 0.88; letter-spacing: -0.055em;
}
.ms-meta { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 16px; align-items: end; }
.ms-arrow { font-size: 1.1rem; color: var(--ink); }

/* statement */
.ms-statement { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 32px; align-items: end; padding-block: 36px 8px; }
.ms-statement-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ms-statement-side p { margin: 0; }
.ms-calbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-width: 280px; }
.ms-calbar span { height: 8px; background: var(--line); }
.ms-calbar span.on { background: var(--ink); }

/* spec rows: name | description | value, separated by hairlines */
.ms-rows { border-top: 1px solid var(--ink); }
.ms-specrow {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) auto; gap: 24px; align-items: baseline;
  padding-block: 18px; border-bottom: 1px solid var(--line);
}
.ms-specname { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.015em; }
.ms-specdesc { font-size: 0.92rem; }
.ms-spectime { font-size: 0.95rem; }

.ms-actions { align-items: center; }
.ms-nav { gap: 8px; }

/* black band */
.ms-week {
  width: 100vw; margin-left: calc(50% - 50vw); margin-bottom: -40px; margin-top: auto;
  background: var(--band-bg); color: var(--band-ink);
  padding-block: 36px 48px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.ms-week > * { max-width: 1152px; margin-inline: auto; }
.ms-week .label { color: var(--band-muted); display: block; margin-bottom: 14px; }
.ms-weekrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--band-line); }
.ms-day { display: flex; flex-direction: column; gap: 14px; padding: 14px 0 0; border-right: 1px solid var(--band-line); padding-left: 10px; }
.ms-day:last-child { border-right: none; }

        el('div', { class: 'dr-timebar' }, timeFill),
        el('div', { class: 'dr-hud' }, [el('div', { class: 'dr-hud-left' }, [badge, repLbl]), endBtn]),
        hint, lockBtn, overlay, toast]);

      /* ---- overlays ---- */

      }

        const btn = el('button', { class: 'btn btn-primary btn-big', type: 'button', text: 'Start' });
        showOverlay(el('div', { class: 'card dr-panel' }, [
          el('div', { class: 'label', text: 'Level ' + level + ' · ' + cfg.name }),
          el('h1', { class: 'h-display', text: 'Dead Reckoning' }),
          el('p', { class: 'prose', text: 'Watch the walker as it walks a route, one leg at a time. The start marker disappears after the first steps, so keep track of where home is as you go.' + (cfg.ego ? ' The view turns with the walker: ahead is always up.' : '') }),
          el('p', { class: 'prose', text: 'At the end, drag from the walker back toward the start. The direction is your aim; the length of the line is how far.' }),
          btn]));

      }
      async function techniqueCard() {

        showOverlay(el('div', { class: 'card dr-panel' }, [
          el('div', { class: 'label', text: 'Technique · Level ' + level }),
          el('h2', { class: 'h-2', text: c[0] }),
          el('p', { class: 'prose', text: c[1] }), el('p', { class: 'prose', text: c[2] }), btn]));
        btn.focus();

      }

        let dragging = false;

        const rep = {

          trueAngle: Math.round(route.home.angle * 10) / 10, guessAngle: Math.round(guessAngle * 10) / 10,
          angErr: Math.round(sc.angErr * 10) / 10, angErrSigned: Math.round(sc.angErrSigned * 10) / 10,
          trueDist: Math.round(route.home.dist * 100) / 100, guessDist: Math.round(guessDist * 100) / 100,

      el('header', { class: 'spread' }, [el('h1', { class: 'h-display', text: sample === true ? 'History · sample data' : 'History' }), el('button', { class: 'btn btn-quiet', type: 'button', text: '← Back', onclick: () => { if (historyHandle) { historyHandle.destroy(); historyHandle = null; } home(); } })]),
      sample === true
        ? el('p', { class: 'ms-samplenote', text: 'These are made-up sessions showing what six weeks of training looks like. None of it is yours.' })
        : (!real.some(s => s.pvt) && el('div', { class: 'card spread' }, [el('span', { class: 'muted', text: 'No sessions yet. Your charts appear after your first morning.' }), el('button', { class: 'btn', type: 'button', text: 'Preview with sample data', onclick: () => historyScreen(true) })])),
      host
    ]));
    historyHandle = Scout.modules.history.mount(host, sessions, {
      onClearAll: () => { if (sample === true) return historyScreen(); store.clearAll(); historyScreen(); }
    });
  }

  /* ---------- about ---------- */
  function about() {
    const part = (name, what, how, payoff) => el('article', { class: 'ms-aboutrow ms-in' }, [
      el('h2', { class: 'ms-specname', text: name }),
      el('div', { class: 'ms-aboutcol' }, [el('div', { class: 'label', text: 'What it is' }), el('p', { text: what }), el('p', { class: 'muted', text: how })]),
      el('div', { class: 'ms-aboutcol' }, [el('div', { class: 'label', text: 'The payoff with routine' }), el('p', { text: payoff })])
    ]);
    const phase = (when, title, text) => el('div', { class: 'ms-phase' }, [
      el('div', { class: 'num ms-phasewhen', text: when }), el('div', { class: 'ms-phasetitle', text: title }), el('p', { class: 'muted', text })
    ]);
    show(el('main', { class: 'screen ms-about' }, [
      el('header', { class: 'spread' }, [el('h1', { class: 'h-display', text: 'About' }), el('button', { class: 'btn btn-quiet', type: 'button', text: '← Back', onclick: home })]),
      el('p', { class: 'ms-lede prose', text: 'A grip-strength test for the mind. One fixed measure tells you how ready your brain is this morning; two short training blocks rebuild skills that modern life lets fade: wide peripheral awareness and an internal sense of direction.' }),

      el('section', { class: 'ms-aboutlist' }, [
        part('Reaction check',
          'A three-minute vigilance test. Numbers appear at random moments and you tap the instant you see them.',
          'It’s the most sleep-sensitive measure in the field and almost immune to practice, so it never gets trained. Lapses, the responses slower than 355 ms, are the key number: they rise with sleep debt before you feel it. The boredom is the test; holding focus through it is what’s being measured.',
          'After ten sessions you have a personal baseline, and each morning is compared to your own normal rather than to anyone else. Over weeks you learn what actually moves your numbers: short sleep, a late drink, a heavy day. It’s an objective second opinion on how you feel, and it sets how hard today’s training pushes.'),
        part('Wide Field',
          'A scene flashes for a fraction of a second while your eyes stay on the centre. You name the central symbol and locate the diamond at the edge.',
          'This is useful-field-of-view training: how much you can take in at a single glance, and how fast. The flash shortens each time you succeed and lengthens when you miss, keeping you at your limit.',
          'Your threshold, the shortest flash you can still read, falls as the visual system learns to take in more of a scene before conscious looking starts. In a large long-term trial in older adults, this kind of training produced effects that lasted years and was linked to fewer at-fault car crashes. Outdoors it means noticing movement at the edges sooner, without turning your head.'),
        part('Dead Reckoning',
          'A walker follows a route you can only partly see. At the end, you point back to the start and say how far it is.',
          'The technique it teaches is how navigators and animals do it: keep one running arrow pointing home and update it after every leg, instead of remembering the route. Six levels move from a map view to turning with the world and judging distance from pace and time.',
          'A sense of direction that works without a screen. Heavy satnav use is linked to weaker spatial memory, while finding your own way exercises the brain’s navigation system. The Field drills carry it outside, where your legs and inner ear add real turns and distances.')
      ]),

      el('section', { class: 'ms-phases' }, [
        el('div', { class: 'label', text: 'What to expect, by session' }),
        el('div', { class: 'ms-phasegrid' }, [
          phase('S01–S10', 'Calibration', 'You’re learning the tasks, so numbers improve quickly, mostly from familiarity. The reaction check is building your baseline; no colours yet.'),
          phase('S11–S30', 'Real gains', 'Readiness colours begin. Wide Field thresholds fall steadily and Dead Reckoning climbs levels. Most of the visible improvement happens here.'),
          phase('S30 +', 'Maintenance', 'Gains slow and plateau, which is normal. The routine now keeps the skills sharp, and your readiness history becomes a useful record of what affects you.')
        ])
      ]),

      el('section', { class: 'ms-limits' }, [
        el('div', { class: 'label', text: 'Honest limits' }),
        el('ul', {}, [
          el('li', { text: 'Training improves the trained skills and close relatives of them. It won’t raise general intelligence; no brain training reliably does.' }),
          el('li', { text: 'This isn’t a medical test. A run of red mornings is worth paying attention to, but it isn’t a diagnosis.' }),
          el('li', { text: 'Readings are only comparable if conditions are: same tablet, same time after waking, same caffeine routine.' })
        ])
      ])
    ]));
  }

  /* ---------- field drills ---------- */
  function drills() {
    const drill = (title, time, steps, why) => el('article', { class: 'card ms-drill' }, [
      el('div', { class: 'spread' }, [el('h2', { class: 'h-2', text: title }), el('span', { class: 'label', text: time })]),
      el('ol', { class: 'ms-steps' }, steps.map(s => el('li', { text: s }))),
      el('p', { class: 'muted ms-small', text: why })
    ]);
    show(el('main', { class: 'screen' }, [
      el('header', { class: 'spread' }, [el('h1', { class: 'h-display', text: 'Field drills' }), el('button', { class: 'btn btn-quiet', type: 'button', text: '← Back', onclick: home })]),
      el('p', { class: 'prose muted', text: 'The screen trains the core. These carry it into real space, where your body’s own motion sense joins in.' }),
      el('div', { class: 'ms-drills' }, [
        drill('Wide-angle gaze', '1–2 min', [
          'Pick a point straight ahead at eye level, a little above the horizon.',
          'Without moving your eyes, widen your attention until you can feel both hands held out to your sides, wiggling their fingers.',
          'Hold that soft, wide focus and walk slowly. Notice anything that moves at the edges before you look at it.'
        ], 'Trackers call this splatter vision. Motion detection is strongest in the periphery, so this is the mode for spotting animals or changes in a landscape.'),
        drill('Point home', 'any walk', [
          'At the start of a walk, note your direction using a landmark or the sun.',
          'Every few turns, stop and point to where you started. Say the bearing as a clock face: “home is at 7 o’clock.”',
          'Check with your phone’s compass or map, then walk on and update your home arrow.'
        ], 'This is the same skill as the Dead Reckoning block, with your inner ear and legs supplying the turns and distances.'),
        drill('Pace count', '5 min, once', [
          'Measure 100 metres on a path, or use a running track.',
          'Walk it at a normal pace, counting each time your left foot lands.',
          'Repeat twice and average. That number is your pace count for 100 m on flat ground. Expect more paces uphill and on rough ground.'
        ], 'Soldiers and navigators use pace counts to estimate distance without instruments. It sharpens the distance half of dead reckoning.'),
        drill('Silent count', '1 min', [
          'Stand somewhere with activity: a park, a street, a garden.',
          'In one glance of about a second, take in the scene, then look away.',
          'Say how many people, birds or vehicles were there. Look back to check.'
        ], 'Quick estimation of numbers at a glance pairs with the Wide Field training: taking in a whole scene before deliberate looking kicks in.')
      ])
    ]));
  }

  /* ---------- settings ---------- */
  function settings() {
    const prefs = loadPrefs();
    const t = loadTrain();
    const confirmBox = el('div', { class: 'card ms-confirm', hidden: true }, [
      el('p', { text: 'This deletes every session and your training levels on this tablet. It can’t be undone.' }),
      el('div', { class: 'row' }, [
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { confirmBox.hidden = true; } }),
        el('button', { class: 'btn btn-danger', type: 'button', text: 'Delete everything', onclick: () => { store.clearAll(); home(); } })
      ])
    ]);
    const resetBox = el('div', { class: 'card ms-confirm', hidden: true }, [
      el('p', { text: 'Training levels go back to the start: Wide Field stage 1 at 250 ms, Dead Reckoning level 1. Your session history stays.' }),
      el('div', { class: 'row' }, [
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { resetBox.hidden = true; } }),
        el('button', { class: 'btn btn-danger', type: 'button', text: 'Reset levels', onclick: () => { store.set('train', {}); settings(); } })
      ])
    ]);
    show(el('main', { class: 'screen ms-settings' }, [
      el('header', { class: 'spread' }, [el('h1', { class: 'h-display', text: 'Settings' }), el('button', { class: 'btn btn-quiet', type: 'button', text: '← Back', onclick: home })]),
      el('section', { class: 'card ms-setrows' }, [
        el('div', { class: 'spread' }, [el('div', {}, [el('strong', { text: 'Wide Field training' }), el('div', { class: 'muted ms-small', text: `Stage ${t.wfStage} · flash ${Math.round(t.wfExposureMs)} ms` })]),
          seg('ms-pref-wf', [[true, 'On'], [false, 'Off']], prefs.widefield, v => { prefs.widefield = v; savePrefs(prefs); })]),
        el('div', { class: 'spread' }, [el('div', {}, [el('strong', { text: 'Dead Reckoning training' }), el('div', { class: 'muted ms-small', text: `Level ${t.drLevel} · ${DR_LEVELS[t.drLevel - 1]}` })]),
          seg('ms-pref-dr', [[true, 'On'], [false, 'Off']], prefs.deadreck, v => { prefs.deadreck = v; savePrefs(prefs); })])
      ]),
      el('section', { class: 'card ms-setrows' }, [
        el('div', { class: 'spread' }, [el('div', {}, [el('strong', { text: 'Reset training levels' }), el('div', { class: 'muted ms-small', text: 'Keeps your history.' })]),
          el('button', { class: 'btn', type: 'button', text: 'Reset levels', onclick: () => { resetBox.hidden = false; } })]),
        resetBox,
        el('div', { class: 'spread' }, [el('div', {}, [el('strong', { text: 'Clear all data' }), el('div', { class: 'muted ms-small', text: 'Sessions, baseline and levels. Stored only on this tablet.' })]),
          el('button', { class: 'btn', type: 'button', text: 'Clear all data', onclick: () => { confirmBox.hidden = false; } })]),
        confirmBox
      ]),
      el('section', { class: 'prose muted ms-small' }, [
        el('p', { text: 'For clean readings: same device, same time after waking (30–60 minutes in is ideal), same position, and the same caffeine routine each day.' }),
        el('p', { text: 'Data stays in this browser on this tablet. Clearing site data or using a private window removes it.' })
      ])
    ]));
  }

  Scout.app = { computeReadiness, home };
  home();
})();

</script>
</body>
</html>
